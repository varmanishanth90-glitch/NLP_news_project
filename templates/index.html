<!DOCTYPE html>
<html>
<head>
    <title>News NLP Search</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>🔎 News NLP Search</h1>
    <form method="POST">
        <input type="text" name="query" placeholder="Enter search term..." required>
        <button type="submit">Search</button>
        <button type="button" id="voice-button">🎤 Voice input</button>
        <span id="voice-status" class="voice-status"></span>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if results %}
        <h2>Results for "{{ query }}"</h2>
        <ul>
        {% for r in results %}
            <li>
                <a href="{{ r['url'] }}" target="_blank">{{ r['title'] }}</a><br>
                <b>Category:</b> {{ r['category'] }}<br>
                <b>Summary:</b> {{ r['summary'] }}
            </li>
        {% endfor %}
        </ul>
    {% endif %}
    <script src="/static/voice.js"></script>
</body>
</html>
